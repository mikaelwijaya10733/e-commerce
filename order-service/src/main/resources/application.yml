server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8083}

logging:
  level:
    com.mikael.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
